[server]
headless = true
# 【安全 2026-07-25 用户批准】只监听本机:局域网设备不可再打开持仓页面
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1a2e"
font = "sans serif"
