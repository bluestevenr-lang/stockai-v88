name: Keep Streamlit Cloud Awake

# 每30分钟 ping 云端 App，保持活跃防止因无访问而休眠。
# 公开仓 Actions 免费、不占私仓配额。已睡着的需人工点「Yes, get this app back up!」唤醒一次。
on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app health + home
        run: |
          URL="https://v88-cloud.streamlit.app"
          echo "Ping $URL/_stcore/health"
          curl -sSL --max-time 60 -o /dev/null -w "health: %{http_code}\n" "$URL/_stcore/health" || true
          echo "Ping $URL (home)"
          curl -sSL --max-time 90 -o /dev/null -w "home: %{http_code}\n" "$URL/" || true
