name: V88 免费行情·日报周报·飞书（无模型额度依赖）
on:
  schedule:
    - cron: '11 22 * * *'
    - cron: '42 3 * * *'
    - cron: '42 10 * * *'
    # Half-hour intraday ticks; avoid the congested top of each hour.
    - cron: '7,37 1-8,13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      fast:
        description: '轻量盘中报价与规则筛选，不调用模型'
        type: boolean
        default: false
      send:
        description: '发送当前时段飞书（沿用持久去重，不重复发送）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: v88-autonomous-facts
  cancel-in-progress: false
jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    env:
      V88_DISABLE_LLM: '1'
      V88_FEISHU_ALLOW_PUSH: '0'
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      V88_FEISHU_STATE_DIR: ${{ github.workspace }}/state
      GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: core
      - name: Check verified exchange trading window
        id: window
        env:
          FAST_REFRESH: ${{ inputs.fast == true || github.event.schedule == '7,37 1-8,13-21 * * 1-5' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: python3 src/intraday_schedule.py
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          repository: bluestevenr-lang/v88-daily-report
          token: ${{ secrets.PRIVATE_TOKEN }}
          ref: feishu-delivery-state
          path: state
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install free runtime
        if: steps.window.outputs.run == 'true'
        run: pip install -q -r requirements.txt
      - name: Git authentication for existing private state and public facts
        if: steps.window.outputs.run == 'true'
        run: gh auth setup-git
      - name: Restore private inputs (no public logs or artifacts)
        if: steps.window.outputs.run == 'true'
        run: python src/feishu_cloud_bundle.py restore ../state/source-bundle.tar.gz > /tmp/v88-restore.log 2>&1
      - name: Refresh facts, reports and permanent calendar without models
        if: steps.window.outputs.run == 'true'
        env:
          FAST_REFRESH: ${{ inputs.fast == true || github.event.schedule == '7,37 1-8,13-21 * * 1-5' }}
        run: |
          if [ "$FAST_REFRESH" = "true" ]; then
            python src/autonomous_runtime.py --fast
          else
            python src/autonomous_runtime.py
          fi
      - name: Validate the replacement rule digest without sending
        if: steps.window.outputs.run == 'true'
        run: |
          python src/feishu_schedule.py --preview > /tmp/v88-preview.json
          python - <<'PYCODE'
          import json
          d=json.load(open('/tmp/v88-preview.json'))
          assert d.get('status')=='PREVIEW' and 'GitHub规则版' in d.get('text',''), 'Rule digest not ready'
          print(json.dumps({'report_mode':'github-rules-three-slot-v1','model_calls':d.get('model_calls'),'characters':len(d['text']),'external_messages':0}))
          PYCODE
      - name: Verify Astra cycle refreshed (reports already delivered independently)
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from astra_cycle import cycle_dates
          now = datetime.now(timezone.utc)
          status = json.load(open('data/autonomous_status.json'))
          step = next((s for s in status['steps'] if s['step'] == 'astra_cycle'), {})
          assert step.get('ok'), 'Astra refresh failed; retained history is not a new calculation'
          doc = json.load(open('data/astra_cycle.json'))
          assert doc['cycle_id'] == cycle_dates(now)[0].isoformat(), 'Astra cycle not rolled over'
          age = (now-datetime.fromisoformat(doc['generated_at'])).total_seconds()
          assert 0 <= age < 3600 and doc['model_calls'] == 0, 'Astra calculation is not current'
          print(json.dumps({'astra_cycle':doc['cycle_id'],'candidates':len(doc['rows']),
                            'rule_matched':doc['rule_matched_count'],'model_calls':0}))
          PY
      # Never upload a private checkout, logs, source bundle, or full report as
      # artifacts of this public repository. Runtime history stays in state.
  delivery:
    needs: facts
    if: always() && (inputs.send == true || (github.event_name == 'schedule' && github.event.schedule != '7,37 1-8,13-21 * * 1-5'))
    uses: ./.github/workflows/feishu_delivery.yml
    secrets: inherit
