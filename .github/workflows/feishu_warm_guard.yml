name: V88 飞书提前就绪定时发送
on:
  schedule:
    # Start two hours before Beijing 06:30 / 12:01 / 19:01.
    - cron: '30 20 * * *'
    - cron: '1 2 * * *'
    - cron: '1 9 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '提前就绪的日报时段（北京时间）'
        required: true
        type: choice
        options: [morning, afternoon, evening]
permissions:
  contents: read
  actions: write
concurrency:
  group: v88-feishu-warm-${{ inputs.slot || github.event.schedule }}
  cancel-in-progress: false
jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    outputs:
      deliver: ${{ steps.wait.outputs.deliver }}
    steps:
      - uses: actions/checkout@v4
      - name: Read private Muse collector (no sending credentials)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          ref: main
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: muse-core
          sparse-checkout: |
            src/muse_exchange.py
            src/muse_review.py
          sparse-checkout-cone-mode: false
      - name: Refresh data before target time and wait for delivery
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          MUSE_PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          MUSE_COLLECTOR_SCRIPT: muse-core/src/muse_exchange.py
          REPORT_SLOT: ${{ inputs.slot }}
          REPORT_CRON: ${{ github.event.schedule }}
        run: python3 scripts/feishu_warm_guard.py
  delivery:
    needs: ready
    if: needs.ready.outputs.deliver == 'true'
    uses: ./.github/workflows/feishu_delivery.yml
    secrets: inherit
