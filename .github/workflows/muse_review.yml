name: V88 Muse 草案与裁决收集（无推送）
on:
  schedule:
    # Beijing 05:40–06:20, 11:30–11:55, 18:10–18:50; no waiting runner/lock.
    - cron: '40,45,50,55 21 * * *'
    - cron: '0,5,10,15,20 22 * * *'
    - cron: '30,35,40,45,50,55 3 * * *'
    - cron: '10,15,20,25,30,35,40,45,50 10 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '只生成草案并收集裁决；不发送飞书。auto遵守窗口。'
        type: choice
        default: auto
        options: [auto, morning, afternoon, evening]
      probe_date:
        description: '只读凭据/路径诊断日期YYYY-MM-DD；填写时不发布草案或写回执，slot须指定'
        type: string
        default: ''
  workflow_run:
    # Independent wakeups; the existing window check prevents off-hours work.
    workflows: ['Keep Streamlit Cloud Awake', 'V88 健康自检（公共仓免费运行）']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: v88-muse-exchange
  cancel-in-progress: false
jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: core
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
      V88_DISABLE_LLM: '1'
      V88_FEISHU_ALLOW_PUSH: '0'
      PYTHONPATH: src
      REVIEW_SLOT: ${{ inputs.slot || 'auto' }}
      PROBE_DATE: ${{ inputs.probe_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          ref: main
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: core
      - name: Check window before dependencies
        id: window
        run: |
          if [ -n "$PROBE_DATE" ]; then
            python3 src/muse_exchange.py --probe-date "$PROBE_DATE" --slot "$REVIEW_SLOT"
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          elif [ "$REVIEW_SLOT" != "auto" ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            python3 src/muse_exchange.py --check-window
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.needed == 'true'
        with:
          repository: bluestevenr-lang/v88-daily-report
          ref: feishu-delivery-state
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: state
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source-bundle.tar.gz
            /runtime-bundle.json
            /feishu_sync_delivery.json
            /recommendation-journal-view.json
            /recommendation-journal-view.json.gz
      - uses: actions/setup-python@v5
        if: steps.window.outputs.needed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install report reader
        if: steps.window.outputs.needed == 'true'
        run: pip install -q -r requirements.txt
      - name: Restore publications without starting data or sending jobs
        if: steps.window.outputs.needed == 'true'
        run: python src/feishu_cloud_bundle.py restore ../state/source-bundle.tar.gz --reports-only > /tmp/v88-review-restore.log 2>&1
      - name: Publish immutable draft and collect on-time verdict
        if: steps.window.outputs.needed == 'true'
        run: |
          if [ "$REVIEW_SLOT" = "auto" ]; then
            python src/muse_exchange.py
          else
            python src/muse_exchange.py --slot "$REVIEW_SLOT"
          fi
      # No report bodies, private sources or verdicts in public artifacts/logs.
