name: Windows startup compatibility

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - runtime_guard.py
      - platform_lock.py
      - win/verify_runtime.py
      - requirements.txt
      - tests/test_windows_platform.py
      - .github/workflows/windows-compat.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      V88_DISABLE_LLM: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Import actual UI startup and check native locks and processes
        run: python -m pytest -q tests/test_runtime_guard.py tests/test_windows_platform.py
