name: V88 shared decision release
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - decision_release.json
      - tests/test_shared_release.py
      - tests/test_cloud_entrypoint.py
      - tests/test_cloud_market_context.py
      - .github/workflows/decision-release.yml
  pull_request:
    paths:
      - '*.py'
      - decision_release.json
      - tests/test_shared_release.py
      - tests/test_cloud_entrypoint.py
      - tests/test_cloud_market_context.py
      - .github/workflows/decision-release.yml
permissions:
  contents: read
jobs:
  isolated-cloud-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_shared_release.py
  cloud-page-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_cloud_entrypoint.py tests/test_cloud_market_context.py
