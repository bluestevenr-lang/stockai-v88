name: V88 飞书三时段回执与补漏
on:
  schedule:
    # Primary triggers: Beijing 06:30 / 12:01 / 19:01 (UTC below).
    - cron: '30 22 * * *'
    - cron: '1 4,11 * * *'
    # Independent 15-minute receipt reconciliation retains catch-up/deduplication.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      debug_slot:
        description: '用户主动要求的调试版；独立回执，不占用定时报'
        type: choice
        default: none
        options: [none, morning, afternoon, evening]
  workflow_call: {}
  workflow_run:
    # Independent existing wakeups recover when this workflow's cron is delayed.
    workflows: ["Keep Streamlit Cloud Awake", "V88 健康自检（公共仓免费运行）"]
    types: [completed]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: v88-feishu-durable-outbox
      cancel-in-progress: false
    defaults:
      run:
        working-directory: core
    env:
      V88_DISABLE_LLM: '1'
      V88_FEISHU_ALLOW_PUSH: '0'
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      V88_FEISHU_STATE_DIR: ${{ github.workspace }}/state
      GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          ref: main
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: core
      - name: Check each due slot before installing dependencies
        id: due
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DEBUG_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_slot || 'none' }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/bluestevenr-lang/v88-daily-report/contents/feishu_sync_delivery.json?ref=feishu-delivery-state' > /tmp/v88-outbox.json
          if [ "$DEBUG_SLOT" != "none" ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            python3 src/feishu_reconcile.py --check-state /tmp/v88-outbox.json
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.needed == 'true'
        with:
          repository: bluestevenr-lang/v88-daily-report
          token: ${{ secrets.PRIVATE_TOKEN }}
          ref: feishu-delivery-state
          path: state
      - uses: actions/setup-python@v5
        if: steps.due.outputs.needed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install read-only report runtime
        if: steps.due.outputs.needed == 'true'
        run: pip install -q -r requirements.txt
      - name: Restore latest cloud publications and receipts
        if: steps.due.outputs.needed == 'true'
        run: |
          gh auth setup-git
          python src/feishu_cloud_bundle.py restore ../state/source-bundle.tar.gz > /tmp/v88-restore.log 2>&1
      - name: Deliver due reports; require durable provider acceptance
        if: steps.due.outputs.needed == 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DEBUG_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_slot || 'none' }}
        run: |
          if [ "$DEBUG_SLOT" != "none" ]; then
            python src/feishu_debug.py --slot "$DEBUG_SLOT"
          else
            python src/feishu_reconcile.py
          fi
      # No private sources, payloads, secrets or state uploaded as public artifacts.
