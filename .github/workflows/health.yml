name: V88 健康自检（公共仓免费运行）

on:
  schedule:
    # 【V88·省流量定则 2026-07-16】交易日每6小时；周末只在周报生成后查一次（BJT 11:23）
    - cron: "23 */6 * * 1-5"
    - cron: "23 3 * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: v88-cloud-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V88_DISABLE_LLM: '1'
      V88_FEISHU_ALLOW_PUSH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Check actual publications, source health and durable receipts
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PYTHONPATH: core/src
        run: python core/src/cloud_reliability.py
