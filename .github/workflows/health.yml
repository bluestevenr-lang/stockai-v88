name: V88 健康自检（公共仓免费运行）

on:
  schedule:
    # 纠错模式：交易日每小时自检并自动恢复；周末每 6 小时一次
    - cron: "19 * * * 1-5"
    - cron: "19 */6 * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write   # pub/health.json；快照损坏时恢复上一份健康版本
  actions: write    # 重新派发刷新、重跑失败任务
  issues: write     # 自动手段无效时开 issue，恢复后自动关闭
concurrency:
  group: v88-cloud-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V88_DISABLE_LLM: '1'
      V88_FEISHU_ALLOW_PUSH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bluestevenr-lang/v88-daily-report
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -c core/constraints-cloud-20261012.txt requests
      - name: Detect, cross-check and self-heal (no models, no messages)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          HEAL_TOKEN: ${{ github.token }}
          PYTHONPATH: core/src
        run: python core/src/cloud_self_heal.py
