name: live-data

# V88 三端共用实时层：中/港、美股交易日盘中每 30 分钟刷新一次（信息及时性）。
# 产出大盘快照 + 热点新闻流到 data 分支 pub/，供网页/云端/飞书同源读取。
# （完整日报仍由私有仓 v88-daily-report 每时段一次生成：北京时间 07/14/21）
# 公共仓 Actions 分钟数免费，不占私仓额度。

on:
  schedule:
    # 交易日每 30 分钟：UTC 01:00-08:30 = BJT 09:00-16:30（A/港）；
    #                  UTC 13:00-20:30 = BJT 21:00-04:30（美股）。
    - cron: "*/30 1-8,13-20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: live-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install --quiet yfinance pandas feedparser requests python-dotenv
      - name: Build & publish live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RSS_PROXY: ""            # 美国节点直连全部源
          KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }} # 订阅K3-256K英文标题批量翻译
          V88_KIMI_MODEL: k3-256k
        run: python live_publish.py
